
name: Format Python

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install formatters
        run: |
          pip install black==23.1.0 isort==5.12.0

      - name: Format Python files
        run: |
          black init-airflow-connection.py
          black superset/superset_config.py
          black dags/products_pipeline.py
          black dags/sales_pipeline.py
          black setup_superset.py
          isort init-airflow-connection.py
          isort dags/products_pipeline.py
          isort dags/sales_pipeline.py
          isort setup_superset.py

      - name: Verify formatting
        run: |
          black --check .
          isort --check-only .

      - name: Commit formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add init-airflow-connection.py superset/superset_config.py dags/products_pipeline.py dags/sales_pipeline.py setup_superset.py
            git commit -m "Fix Python formatting and import order"
            git push
          else
            echo "No formatting changes needed"
          fi
